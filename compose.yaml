# Top-level Docker Compose entrypoint for OpenFoundry.
#
# Allows `docker compose up -d` from the repo root without -f flags.
# Delegates to the real compose files under infra/ via `include:`.
#
# Default stack: core platform (infra/compose/docker-compose.yml).
# Choose an explicit project name on first start, for example:
#   docker compose -p openfoundry -f compose.yaml up -d
# To layer dev extras for that project:
#   docker compose -p openfoundry -f infra/compose/docker-compose.yml -f infra/compose/docker-compose.dev.yml up -d
# Existing installations must use their original project name and Compose file set.
#
# A monitoring overlay will be reintroduced as part of the formal
# observability work (T17). See docs/observability/index.md.

include:
  - path: infra/compose/docker-compose.yml
