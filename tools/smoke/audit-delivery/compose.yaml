services:
  kafka:
    image: apache/kafka:3.7.1
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 1
    healthcheck:
      test: ["CMD", "/opt/kafka/bin/kafka-broker-api-versions.sh", "--bootstrap-server", "kafka:9092"]
      interval: 2s
      timeout: 10s
      retries: 30

  policy:
    image: alpine:3.22
    entrypoint: ["/service"]
    volumes: ["${FIXTURE_BIN:?}/authorization-policy-service:/service:ro"]
    ports: ["127.0.0.1::${FIXTURE_POLICY_PORT:?}"]
    environment:
      HOST: 0.0.0.0
      PORT: ${FIXTURE_POLICY_PORT:?}
      JWT_SECRET: ${FIXTURE_JWT_SECRET:?}
      DATABASE_URL: ${FIXTURE_DATABASE_URL:?}

  sink:
    image: alpine:3.22
    entrypoint: ["/service"]
    volumes: ["${FIXTURE_BIN:?}/audit-sink:/service:ro"]
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      ICEBERG_CATALOG_URL: ${FIXTURE_TABLE_URL:?}
      ICEBERG_WAREHOUSE: audit-fixture
      AUDIT_SINK_BATCH_MAX_RECORDS: 1
      AUDIT_SINK_BATCH_MAX_WAIT_SECONDS: 1
