services:
  kafka:
    image: apache/kafka:3.7.1
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 1
    healthcheck:
      test: ["CMD", "/opt/kafka/bin/kafka-broker-api-versions.sh", "--bootstrap-server", "kafka:9092"]
      interval: 2s
      timeout: 10s
      retries: 30
  connect:
    image: quay.io/debezium/connect:2.7.2.Final
    depends_on:
      kafka: { condition: service_healthy }
    environment:
      BOOTSTRAP_SERVERS: kafka:9092
      GROUP_ID: wp15-connect
      CONFIG_STORAGE_TOPIC: wp15_connect_configs
      OFFSET_STORAGE_TOPIC: wp15_connect_offsets
      STATUS_STORAGE_TOPIC: wp15_connect_statuses
      CONFIG_STORAGE_REPLICATION_FACTOR: "1"
      OFFSET_STORAGE_REPLICATION_FACTOR: "1"
      STATUS_STORAGE_REPLICATION_FACTOR: "1"
      KEY_CONVERTER: org.apache.kafka.connect.json.JsonConverter
      VALUE_CONVERTER: org.apache.kafka.connect.json.JsonConverter
      ENABLE_DEBEZIUM_SCRIPTING: "false"
      KAFKA_HEAP_OPTS: -Xmx640m -Xms320m
    ports: ["127.0.0.1::8083"]
  source:
    image: postgres:16-alpine
    command: ["postgres", "-c", "wal_level=logical"]
    environment:
      POSTGRES_DB: orders
      POSTGRES_PASSWORD: ${SOURCE_PASSWORD:?}
    healthcheck:
      test: ["CMD", "pg_isready", "-h", "127.0.0.1", "-U", "postgres", "-d", "orders"]
      interval: 2s
      timeout: 3s
      retries: 30
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_PASSWORD: ${DB_PASSWORD:?}
      POSTGRES_USER: openfoundry
      POSTGRES_DB: datasets
    healthcheck:
      test: ["CMD", "pg_isready", "-h", "127.0.0.1", "-U", "openfoundry", "-d", "datasets"]
      interval: 2s
      timeout: 3s
      retries: 30
  dataset:
    image: alpine:3.22
    entrypoint: ["/service"]
    volumes:
      - ${BIN_DIR:?}/dataset-versioning-service:/service:ro
    environment:
      HOST: 0.0.0.0
      PORT: 50078
      JWT_SECRET: ${JWT_SECRET:?}
      DATABASE_URL: postgres://openfoundry:${DB_PASSWORD:?}@postgres:5432/datasets
      DATASET_FILES_BASE_URL: http://127.0.0.1:${WP23_DVS_PORT:?}
      DATASET_FILES_ROOT_DIR: /var/of/backing
      DATASET_STAGED_OUTPUTS_DIR: /var/of/staging
    depends_on:
      postgres:
        condition: service_healthy
    ports: ["127.0.0.1:${WP23_DVS_PORT:?}:50078"]
  worker:
    image: alpine:3.22
    entrypoint: ["/orders-cdc"]
    volumes:
      - ${BIN_DIR:?}/orders-cdc:/orders-cdc:ro
      - ${CDC_SECRETS:?}:/credentials:ro
    environment:
      CDC_DATASET_ID: ${CDC_DATASET_ID:-}
      CDC_SOURCE_PREFIX: wp15
      CDC_SOURCE_DATABASE: orders
      CDC_KAFKA_BROKER: kafka:9092
      CDC_DATABASE_URL: postgres://worker:${WORKER_PASSWORD:?}@postgres/checkpoints?sslmode=disable
      CDC_DVS_URL: http://dataset:50078
      CDC_TOKEN_FILE: /credentials/writer
