{{- /*
WP3.2 / T8 — `schedules-tick` outbox-dispatch CronJob (ADR-0037
time-based triggers; T8 decision §1 transaction ①).

Each invocation runs the schedules-tick CLI ONCE in
`pipeline_outbox_v1` dispatch mode: it verifies the Apicurio registry
fingerprints and the CDC slot, then fires every due scheduling-mode
definition through the transactional outbox (permanent
scheduling.dispatch_audit record + outbox.Enqueue + advance in ONE
transaction). Kafka itself is reached via the Debezium relay — this
CronJob publishes NOTHING directly.

Default OFF (`schedulesTick.enabled=false`); the legacy direct-mode
tick keeps its pre-T8 semantics and is a separate deployment concern.
Enable only AFTER the outbox-pipeline Debezium connector is RUNNING
(the connector template in infra/helm/infra/debezium/ lists the full
gate chain; the CLI's CDC slot gate is the fail-closed backstop).

`concurrencyPolicy: Forbid` keeps overlapping ticks from racing; per
ADR-0037/K8s semantics that only constrains THIS CronJob's jobs —
at-least-once correctness comes from the deterministic event_id and
the consumer's admission dedup, not from Forbid.
*/ -}}
{{- if (.Values.schedulesTick.enabled | default false) }}
apiVersion: batch/v1
kind: CronJob
metadata:
  name: schedules-tick-outbox
  labels:
    app.kubernetes.io/name: schedules-tick
    app.kubernetes.io/component: cronjob
    app.kubernetes.io/part-of: pipeline-build-service
spec:
  schedule: {{ (.Values.schedulesTick.schedule | default "* * * * *") | quote }}
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 5
  startingDeadlineSeconds: 60
  jobTemplate:
    spec:
      backoffLimit: 1
      template:
        metadata:
          labels:
            app.kubernetes.io/name: schedules-tick
        spec:
          restartPolicy: Never
          securityContext:
            runAsNonRoot: true
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: schedules-tick
              image: {{ .Values.schedulesTick.image | default "openfoundry/schedules-tick:dev" | quote }}
              imagePullPolicy: IfNotPresent
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop: [ALL]
              env:
                # Outbox dispatch mode (the whole point of this
                # CronJob). Fail-closed configuration: the CLI exits
                # non-zero if anything below is missing.
                - name: SCHEDULES_DISPATCH_MODE
                  value: pipeline_outbox_v1
                # Same pipeline database the outbox-pipeline Debezium
                # connector tails (same-source contract — see values.yaml
                # and the WP3.2 deployment profile doc). No guessed
                # default: fail at RENDER time rather than at the first
                # tick silently writing a database nothing relays.
                - name: DATABASE_URL
                  valueFrom:
                    secretKeyRef:
                      name: {{ required "schedulesTick.dsnSecret.name is required when schedulesTick.enabled (same-source: the DSN of the database the outbox-pipeline Debezium connector tails — see docs/architecture/data-integration-wp3-2-deployment-profile.md)" .Values.schedulesTick.dsnSecret.name | quote }}
                      key: {{ required "schedulesTick.dsnSecret.key is required when schedulesTick.enabled (e.g. writer_url of pipeline-authoring-db-dsn)" .Values.schedulesTick.dsnSecret.key | quote }}
                # Schema registry the trigger/outcome schemas are
                # registered in (fingerprints pinned in the binary).
                - name: SCHEDULES_REGISTRY_URL
                  value: {{ .Values.schedulesTick.registryUrl | default "http://apicurio-registry.apicurio.svc:8080" | quote }}
                {{- with .Values.schedulesTick.registryGroup }}
                - name: SCHEDULES_REGISTRY_GROUP
                  value: {{ . | quote }}
                {{- end }}
                # EXPLICIT CDC slot gate (must equal the connector's
                # pipelineOutbox.slotName): the tick refuses to fire
                # while the slot is missing / foreign / inactive.
                - name: SCHEDULES_CDC_SLOT
                  value: {{ .Values.schedulesTick.cdcSlot | default "debezium_outbox_pipeline" | quote }}
              resources:
                requests:
                  cpu: 50m
                  memory: 64Mi
                limits:
                  cpu: 200m
                  memory: 128Mi
{{- end }}
