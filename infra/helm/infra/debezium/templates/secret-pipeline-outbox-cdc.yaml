{{- /* dig (not `default`) so an EXPLICIT cdcCredentials.create=false is
       honored: `x | default true` would replace `false` with `true` and
       keep rendering the placeholder Secret in ESO-managed production.
       Only a MISSING key falls back to true. */ -}}
{{- if and (.Values.pipelineOutbox.enabled | default false) (dig "cdcCredentials" "create" true .Values.pipelineOutbox) }}
---
# WP3.2 / T8 — source-DB login for the outbox-pipeline connector.
#
# The role (`debezium_pipeline_cdc` by default) is created by the
# operator prep SQL (postgres-clusters/files/
# pipeline-outbox-cdc-prep.sql) with REPLICATION + USAGE/SELECT on
# outbox.events ONLY. This Secret is NOT read over the Kubernetes API:
# kafka-connect.yaml mounts it via spec.template.pod.volumes +
# template.connectContainer.volumeMounts (Strimzi 1.0 removed
# spec.externalConfiguration; verified against the 1.0.0 KafkaConnect
# CRD) and the worker's builtin FileConfigProvider (alias `secrets`)
# reads it at /mnt/pipeline-outbox-cdc/cdc.properties.
#
# Dev/test only renders the placeholder password from values.yaml; in
# production rotate via External Secrets Operator/Vault and set
# cdcCredentials.create=false — the password MUST equal the one the
# prep SQL sets on the role.
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.pipelineOutbox.cdcCredentials.secretName | default "pg-runtime-config-debezium" }}
  namespace: kafka
  labels:
    openfoundry.io/component: debezium-connect-cdc-credentials
    openfoundry.io/source: {{ .Values.pipelineOutbox.topicPrefix | default "pg-runtime-config" }}
type: Opaque
stringData:
  # Java properties format consumed by FileConfigProvider:
  # ${secrets:/mnt/pipeline-outbox-cdc/cdc.properties:<key>}
  # Keep values properties-safe (no raw =, :, # or leading spaces).
  cdc.properties: |
    username={{ .Values.pipelineOutbox.cdcCredentials.username | default "debezium_pipeline_cdc" }}
    password={{ .Values.pipelineOutbox.cdcCredentials.password | default "PLACEHOLDER_ROTATE_VIA_EXTERNAL_SECRETS" }}
{{- end }}
